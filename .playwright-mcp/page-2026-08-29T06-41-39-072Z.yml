                - strong [ref=f13e1214]: Taste Adjuster (MTDS)
              - generic [ref=f13e1215]:
                - strong [ref=f13e1216]: ":"
                - text: Enhances water taste depending on the source.
              - generic [ref=f13e1217]:
                - strong [ref=f13e1218]: "• RO Cartridge:"
                - text: Removes heavy metals, chemicals, bacteria, and viruses.
              - strong [ref=f13e1220]: •
